# Builds and publishes javascript/planet-time, whose package.json name is
# "interplanet-planet-time" (not "@interplanet/time", which is the TypeScript
# package in typescript/planet-time and has no publish workflow yet).
# Runs only on a tag such as javascript/planet-time/v1.4.0. See docs/RELEASING.md.
name: Publish interplanet-planet-time (javascript/planet-time) to npm

on:
  push:
    tags: ['javascript/planet-time/v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: cd javascript/planet-time && node build.mjs && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
