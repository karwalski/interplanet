# Publishes javascript/ltx, whose package.json name is "interplanet-ltx"
# (not "@interplanet/ltx", which is the TypeScript package in typescript/ltx
# and has no publish workflow yet).
# Runs only on a tag such as javascript/ltx/v1.1.0. See docs/RELEASING.md.
name: Publish interplanet-ltx (javascript/ltx) to npm

on:
  push:
    tags: ['javascript/ltx/v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: cd javascript/ltx && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
